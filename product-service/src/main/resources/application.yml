server:
  port: 8081

spring:
  application:
    name: product-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://9f8d97a4-9691-45df-8fb9-8c215ff7b7be.ciamlogin.com/9f8d97a4-9691-45df-8fb9-8c215ff7b7be/v2.0
          jwk-set-uri: https://petstorecustomers.ciamlogin.com/9f8d97a4-9691-45df-8fb9-8c215ff7b7be/discovery/v2.0/keys
  config:
    import: azureAppConfiguration
  datasource:
    url: jdbc:postgresql://petstore-server-name.postgres.database.azure.com/petstore
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
  cloud:
    azure:
      appconfiguration:
        stores:
          - endpoint: ${APP_CONFIGURATION_ENDPOINT:https://petstore-appconfig.azconfig.io}
            selects:
              - key-filter: app
                label-filter: product-service
              - key-filter: spring
                label-filter: product-service
              - key-filter: server
                label-filter: product-service

app:
  entra:
    client-id: ${ENTRA_CLIENT_ID:}
  keyvault:
    endpoint: https://db-credentials-petstore.vault.azure.net/
  cors:
    allowed-origins: http://localhost:3000,https://petstoreui-web-app-e3cahqc4bad5dthh.centralindia-01.azurewebsites.net
  storage:
    account-name: petstore
    endpoint: https://petstore.blob.core.windows.net/
    container-name: pet-container
    sas-expiry-minutes: 60
  cosmos:
    endpoint: ${COSMOS_ENDPOINT:https://petstore-cosmos.documents.azure.com:443/}
    key: ${COSMOS_KEY:}
    database: ${COSMOS_DATABASE:petstore}
    container: products
