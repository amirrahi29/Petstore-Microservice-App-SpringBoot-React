spring:
  application:
    name: product-service
  config:
    import: azureAppConfiguration
  cloud:
    azure:
      appconfiguration:
        stores:
          - endpoint: ${APP_CONFIGURATION_ENDPOINT:https://petstore-appconfig.azconfig.io}
            selects:
              - key-filter: "spring."
                label-filter: product-service
              - key-filter: "app."
                label-filter: product-service
              - key-filter: "server."
                label-filter: product-service
