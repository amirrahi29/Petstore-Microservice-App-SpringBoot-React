name: petstore-ui

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read

env:
  REGISTRY: petstoreazurecontainerregistry.azurecr.io
  IMAGE: petstore-ui-image
  AZURE_CLIENT_ID: d13d0639-f051-4e71-8e58-970f78132dc9
  AZURE_TENANT_ID: b41b72d0-4e9f-4c26-8a69-f949f367c91d
  AZURE_SUBSCRIPTION_ID: b5c67bf9-6f36-431b-82ea-a27d96f61190

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name petstoreazurecontainerregistry

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: petstore-ui
          push: true
          build-args: |
            VITE_PRODUCT_API=https://product-service-web-app-g7bhexgnaje3brbw.centralindia-01.azurewebsites.net
            VITE_PET_API=https://pet-service-web-app-adgkgbhmfchtfge0.centralindia-01.azurewebsites.net
            VITE_ORDER_API=https://order-service-wep-app-huhhatejg5adc0cr.centralindia-01.azurewebsites.net
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
