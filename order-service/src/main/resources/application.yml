spring:
  application:
    name: order-service
  config:
    import: azureAppConfiguration
  cloud:
    azure:
      appconfiguration:
        stores:
          - endpoint: ${APP_CONFIGURATION_ENDPOINT:https://petstore-appconfig.azconfig.io}
            selects:
              - key-filter: "*"
                label-filter: order-service

app:
  cosmos:
    endpoint: ${COSMOS_ENDPOINT:https://petstore-cosmos.documents.azure.com:443/}
    key: ${COSMOS_KEY:}
    database: ${COSMOS_DATABASE:petstore}
    container: ${COSMOS_CONTAINER:cart}
